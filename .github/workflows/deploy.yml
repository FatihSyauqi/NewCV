name: Deploy to Windows 10 Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Windows 10 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: >
            powershell -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; Write-Host '== 1. Navigating =='; Set-Location 'C:\xampp\htdocs\NewCV'; Write-Host '== 2. Pulling =='; git pull origin main; Write-Host '== 3. Build Admin =='; Set-Location 'C:\xampp\htdocs\NewCV\frontend-admin'; npm install; npm run build; Write-Host '== 4. Build CV =='; Set-Location 'C:\xampp\htdocs\NewCV\frontend-cv'; npm install; npm run build; Write-Host '== 5. Checking PM2 =='; Set-Location 'C:\xampp\htdocs\NewCV'; $out = pm2 list | Out-String; $a = $out -match 'frontend-admin'; $c = $out -match 'frontend-cv'; if ($a -and $c) { Write-Host 'Both exist. Restarting all...'; pm2 restart all } else { if (-not $a) { Write-Host 'Starting Admin...'; Set-Location 'C:\xampp\htdocs\NewCV\frontend-admin'; pm2 start ecosystem.config.js } else { Write-Host 'Restarting Admin...'; pm2 restart frontend-admin }; if (-not $c) { Write-Host 'Starting CV...'; Set-Location 'C:\xampp\htdocs\NewCV\frontend-cv'; pm2 start ecosystem.config.js } else { Write-Host 'Restarting CV...'; pm2 restart frontend-cv } }; Set-Location 'C:\xampp\htdocs\NewCV'; Write-Host '== 6. Saving PM2 =='; pm2 save; Write-Host '== Deployment Completed! =="'